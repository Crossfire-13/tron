<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tron Lightcycles vs AI</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
        }

        body { 
            background: #0a0a12; 
            color: #00f0ff; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            height: 100vh; 
            overflow: hidden; 
        }

        #header { 
            padding: 15px; 
            text-align: center; 
            width: 100%; 
            text-shadow: 0 0 20px #00f0ff, 0 0 40px #0088ff; 
            animation: headerGlow 2s ease-in-out infinite;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        @keyframes headerGlow {
            0%, 100% { text-shadow: 0 0 20px #00f0ff, 0 0 40px #0088ff; }
            50% { text-shadow: 0 0 30px #00f0ff, 0 0 60px #0088ff, 0 0 80px #0055ff; }
        }

        #status { 
            font-size: 1.2rem; 
            margin-top: 8px; 
            color: #ff0077; 
            text-shadow: 0 0 10px #ff0077, 0 0 20px #ff0088; 
            font-weight: bold; 
            letter-spacing: 2px;
        }
        
        #menu-bar { 
            display: flex; 
            gap: 20px; 
            justify-content: center; 
            align-items: center; 
            margin: 12px 0; 
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.08), rgba(0, 136, 255, 0.06));
            padding: 12px 20px; 
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px; 
            flex-wrap: wrap;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        select { 
            background: #020205; 
            color: #00f0ff; 
            border: 2px solid #00f0ff; 
            padding: 8px 12px; 
            font-family: inherit; 
            font-weight: bold; 
            outline: none; 
            border-radius: 6px; 
            cursor: pointer; 
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
            transition: all 0.2s;
        }

        select:hover {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        select:focus {
            background: #1a1a22;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }

        button { 
            background: linear-gradient(135deg, #ff0077, #b30054);
            color: #fff; 
            border: 2px solid #ff0077;
            padding: 8px 18px; 
            font-family: inherit; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 6px; 
            text-shadow: 0 0 5px #000; 
            box-shadow: 0 0 12px rgba(255, 0, 119, 0.5);
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(255, 0, 119, 0.8);
            transform: scale(1.05);
        }

        button:active { 
            background: linear-gradient(135deg, #b30054, #8a003f);
            box-shadow: 0 0 15px rgba(255, 0, 119, 0.6);
        }

        #sound-toggle {
            width: 50px;
            height: 30px;
            background: #020205;
            border: 2px solid #00f0ff;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        #sound-toggle.enabled {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(0, 136, 255, 0.2));
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .sound-dot {
            width: 24px;
            height: 24px;
            background: #00f0ff;
            border-radius: 50%;
            transition: all 0.3s;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        #sound-toggle.enabled .sound-dot {
            transform: translateX(20px);
            background: #00ff88;
        }

        #canvas-container { 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            max-height: 65vh; 
        }

        canvas { 
            background: #020205; 
            border: 4px solid #00f0ff; 
            box-shadow: 0 0 30px #00f0ff, inset 0 0 20px rgba(0, 240, 255, 0.1); 
            max-width: 95vw; 
            max-height: 95vh; 
            aspect-ratio: 1/1;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.3));
        }
        
        #controls { 
            width: 100%; 
            max-width: 400px; 
            padding: 15px; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(2, 65px); 
            gap: 10px; 
            margin-bottom: 20px; 
        }

        .btn { 
            background: rgba(0, 240, 255, 0.12); 
            border: 2px solid #00f0ff; 
            border-radius: 12px; 
            color: #00f0ff; 
            font-size: 1.5rem; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-shadow: 0 0 8px #00f0ff; 
            cursor: pointer; 
            touch-action: manipulation;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            transition: all 0.1s;
        }

        .btn:active { 
            background: #00f0ff; 
            color: #020205; 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transform: scale(0.95);
        }

        #btn-up { grid-column: 2; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        @media (min-width: 768px) { 
            #controls { display: none; } 
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            #menu-bar { gap: 10px; padding: 8px 12px; }
            label { font-size: 0.9rem; }
            button { padding: 6px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>⚡ TRON LIGHTCYCLES ⚡</h1>
        
        <div id="menu-bar">
            <label>AI:
                <select id="ai-difficulty">
                    <option value="easy">EASY</option>
                    <option value="medium" selected>MEDIUM</option>
                    <option value="hard">HARD</option>
                </select>
            </label>
            <label>SPEED:
                <select id="game-speed">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" selected>5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </label>
            <label>SOUND:
                <div id="sound-toggle" class="enabled">
                    <div class="sound-dot"></div>
                </div>
            </label>
            <button id="btn-start">START GAME</button>
        </div>

        <div id="status">Press START GAME to begin</div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <div id="controls">
        <div class="btn" id="btn-up">▲</div>
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-down">▼</div>
        <div class="btn" id="btn-right">▶</div>
    </div>

    <script>
        // ===== Audio Manager =====
        class AudioManager {
            constructor() {
                this.enabled = true;
                this.audioContext = null;
                this.masterVolume = 0.3;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.log('Web Audio API not available');
                }
            }

            playTone(frequency, duration, type = 'sine', volume = 0.3) {
                if (!this.enabled || !this.audioContext) return;
                
                try {
                    const now = this.audioContext.currentTime;
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();

                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);

                    osc.type = type;
                    osc.frequency.value = frequency;
                    gain.gain.setValueAtTime(volume * this.masterVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

                    osc.start(now);
                    osc.stop(now + duration);
                } catch (e) {
                    console.log('Audio playback error:', e);
                }
            }

            // Tron-style laser sound
            playLaserShot() {
                if (!this.enabled || !this.audioContext) return;
                
                try {
                    const now = this.audioContext.currentTime;
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();

                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    
                    gain.gain.setValueAtTime(0.15 * this.masterVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                    osc.start(now);
                    osc.stop(now + 0.1);
                } catch (e) {
                    console.log('Audio playback error:', e);
                }
            }

            // Game over / crash sound
            playCrash() {
                if (!this.enabled || !this.audioContext) return;
                
                try {
                    const now = this.audioContext.currentTime;
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();

                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                    
                    gain.gain.setValueAtTime(0.2 * this.masterVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                    osc.start(now);
                    osc.stop(now + 0.3);
                } catch (e) {
                    console.log('Audio playback error:', e);
                }
            }

            // Victory sound
            playVictory() {
                if (!this.enabled || !this.audioContext) return;

                try {
                    const notes = [523.25, 659.25, 783.99, 1046.5]; // C, E, G, C (higher octave)
                    const now = this.audioContext.currentTime;
                    
                    notes.forEach((freq, i) => {
                        this.playTone(freq, 0.3, 'sine', 0.25);
                    });
                } catch (e) {
                    console.log('Audio playback error:', e);
                }
            }

            // Grid sound (ambient)
            playGridPulse() {
                if (!this.enabled || !this.audioContext) return;
                
                try {
                    const now = this.audioContext.currentTime;
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();

                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);

                    osc.type = 'sine';
                    osc.frequency.value = 220;
                    
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.08 * this.masterVolume, now + 0.05);
                    gain.gain.linearRampToValueAtTime(0, now + 0.15);

                    osc.start(now);
                    osc.stop(now + 0.15);
                } catch (e) {
                    console.log('Audio playback error:', e);
                }
            }
        }

        const audioManager = new AudioManager();

        // ===== Game Canvas & UI =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const diffSelect = document.getElementById('ai-difficulty');
        const speedSelect = document.getElementById('game-speed');
        const startBtn = document.getElementById('btn-start');
        const soundToggle = document.getElementById('sound-toggle');

        let gameInterval = null;
        const stepSize = 5;

        let gameState = {
            p1: { x: 100, y: 300, dir: 'RIGHT', trail: [] },
            ai: { x: 500, y: 300, dir: 'LEFT', trail: [] },
            active: false
        };

        // Sound toggle
        soundToggle.addEventListener('click', () => {
            audioManager.init();
            audioManager.enabled = !audioManager.enabled;
            soundToggle.classList.toggle('enabled', audioManager.enabled);
            if (audioManager.enabled) {
                audioManager.playGridPulse();
            }
        });

        function initMatch() {
            if (gameInterval) clearInterval(gameInterval);
            
            audioManager.init();
            
            gameState.p1 = { x: 100, y: 300, dir: 'RIGHT', trail: [{x: 100, y: 300}] };
            gameState.ai = { x: 500, y: 300, dir: 'LEFT', trail: [{x: 500, y: 300}] };
            gameState.active = true;
            statusDiv.innerText = "⚡ GO! ⚡";

            audioManager.playLaserShot();

            const level = parseInt(speedSelect.value, 10);
            const fps = 15 + (level * 3);

            gameInterval = setInterval(gameLoop, 1000 / fps);
        }

        function gameLoop() {
            if (!gameState.active) return;

            moveCycle(gameState.p1);
            runAI();
            moveCycle(gameState.ai);

            const p1Crash = checkCollision(gameState.p1, gameState.ai);
            const aiCrash = checkCollision(gameState.ai, gameState.p1);

            if (p1Crash || aiCrash) {
                gameState.active = false;
                clearInterval(gameInterval);
                
                if (p1Crash && aiCrash) {
                    statusDiv.innerText = "⚡ TIE CRASH ⚡ BOTH DEFEATED!";
                    audioManager.playCrash();
                } else if (p1Crash) {
                    statusDiv.innerText = "💻 AI WINS! GAME OVER!";
                    audioManager.playCrash();
                } else {
                    statusDiv.innerText = "🎮 YOU WIN! VICTORY!";
                    audioManager.playVictory();
                }
            }

            renderGrid();
        }

        function moveCycle(p) {
            if (p.dir === 'UP') p.y -= stepSize;
            if (p.dir === 'DOWN') p.y += stepSize;
            if (p.dir === 'LEFT') p.x -= stepSize;
            if (p.dir === 'RIGHT') p.x += stepSize;
            p.trail.push({ x: p.x, y: p.y });
        }

        function checkCollision(p, opponent) {
            if (p.x < 0 || p.x >= canvas.width || p.y < 0 || p.y >= canvas.height) return true;

            for (let i = 0; i < p.trail.length - 1; i++) {
                if (p.x === p.trail[i].x && p.y === p.trail[i].y) return true;
            }

            for (let i = 0; i < opponent.trail.length; i++) {
                if (p.x === opponent.trail[i].x && p.y === opponent.trail[i].y) return true;
            }

            return false;
        }

        function countFreeSteps(dir, startX, startY, maxSteps) {
            let steps = 0;
            let currX = startX;
            let currY = startY;
            let dx = 0, dy = 0;
            
            if (dir === 'UP') dy = -stepSize;
            if (dir === 'DOWN') dy = stepSize;
            if (dir === 'LEFT') dx = -stepSize;
            if (dir === 'RIGHT') dx = stepSize;

            for (let s = 1; s <= maxSteps; s++) {
                currX += dx;
                currY += dy;
                let mockBike = { x: currX, y: currY, trail: gameState.ai.trail };
                if (checkCollision(mockBike, gameState.p1)) break;
                steps++;
            }
            return steps;
        }

        function runAI() {
            const ai = gameState.ai;
            const difficulty = diffSelect.value;

            const directions = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
            const validDirs = directions.filter(d => {
                if (d === 'UP' && ai.dir === 'DOWN') return false;
                if (d === 'DOWN' && ai.dir === 'UP') return false;
                if (d === 'LEFT' && ai.dir === 'RIGHT') return false;
                if (d === 'RIGHT' && ai.dir === 'LEFT') return false;
                return true;
            });

            const lookAheadDepth = (difficulty === 'hard') ? 25 : (difficulty === 'medium' ? 12 : 5);
            let safeChoices = [];

            validDirs.forEach(d => {
                let testX = ai.x;
                let testY = ai.y;
                if (d === 'UP') testY -= stepSize;
                if (d === 'DOWN') testY += stepSize;
                if (d === 'LEFT') testX -= stepSize;
                if (d === 'RIGHT') testX += stepSize;

                let mockBike = { x: testX, y: testY, trail: ai.trail };
                if (!checkCollision(mockBike, gameState.p1)) {
                    const freeSpace = countFreeSteps(d, testX, testY, lookAheadDepth);
                    safeChoices.push({ dir: d, freeSpace });
                }
            });

            if (safeChoices.length === 0) return;

            safeChoices.sort((a, b) => b.freeSpace - a.freeSpace);
            const currentChoice = safeChoices.find(c => c.dir === ai.dir);
            const bestChoice = safeChoices[0];

            if (difficulty === 'hard') {
                if (!currentChoice || currentChoice.freeSpace < bestChoice.freeSpace) {
                    ai.dir = bestChoice.dir;
                }
            } else if (difficulty === 'medium') {
                if (!currentChoice || currentChoice.freeSpace < 3) {
                    ai.dir = bestChoice.dir;
                }
            } else {
                if (!currentChoice || Math.random() < 0.25) {
                    const randomPick = safeChoices[Math.floor(Math.random() * safeChoices.length)];
                    ai.dir = randomPick.dir;
                }
            }
        }

        function renderGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Grid background
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath(); 
                ctx.moveTo(i, 0); 
                ctx.lineTo(i, canvas.height); 
                ctx.stroke();
                ctx.beginPath(); 
                ctx.moveTo(0, i); 
                ctx.lineTo(canvas.width, i); 
                ctx.stroke();
            }

            drawPlayer(gameState.p1, '#00f0ff', '#0088ff');
            drawPlayer(gameState.ai, '#ff0077', '#ff0099');
        }

        function drawPlayer(player, cycleColor, trailColor) {
            if (player.trail.length === 0) return;
            
            // Trail with glow
            ctx.strokeStyle = trailColor;
            ctx.lineWidth = 8;
            ctx.shadowBlur = 15;
            ctx.shadowColor = cycleColor;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            player.trail.forEach((point, i) => {
                if (i === 0) ctx.moveTo(point.x, point.y);
                else ctx.lineTo(point.x, point.y);
            });
            ctx.stroke();

            // Cycle head with glow
            ctx.fillStyle = cycleColor;
            ctx.shadowBlur = 20;
            ctx.shadowColor = cycleColor;
            ctx.fillRect(player.x - 5, player.y - 5, 10, 10);
            
            // Inner bright point
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 25;
            ctx.shadowColor = cycleColor;
            ctx.fillRect(player.x - 2, player.y - 2, 4, 4);
            
            ctx.shadowBlur = 0;
        }

        function handleInput(dir) {
            let p = gameState.p1;
            if (dir === 'UP' && p.dir !== 'DOWN') p.dir = 'UP';
            if (dir === 'DOWN' && p.dir !== 'UP') p.dir = 'DOWN';
            if (dir === 'LEFT' && p.dir !== 'RIGHT') p.dir = 'LEFT';
            if (dir === 'RIGHT' && p.dir !== 'LEFT') p.dir = 'RIGHT';
        }

        // Keyboard controls
        window.addEventListener('keydown', (e) => {
            let d = null;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') d = 'UP';
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') d = 'DOWN';
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') d = 'LEFT';
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') d = 'RIGHT';
            if (d) handleInput(d);
            if (e.key === ' ' || e.key === 'Enter') initMatch();
        });

        // Mobile controls
        const btnMap = { 'btn-up': 'UP', 'btn-down': 'DOWN', 'btn-left': 'LEFT', 'btn-right': 'RIGHT' };
        Object.keys(btnMap).forEach(id => {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handleInput(btnMap[id]);
            });
        });

        startBtn.addEventListener('click', initMatch);

        // Initial render
        renderGrid();
    </script>
</body>
</html>
